<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 흑색 둥근 상자 배경 (SeedTick Brand Dark Container) -->
  <rect width="32" height="32" rx="7" fill="#0f172a" />
  
  <!-- 반전된 백색 완드 막대 로고 (45도 대각선, 상단 끝 채움) -->
  <g transform="rotate(45 16 16)">
    <!-- 전체 바디 아웃라인 -->
    <rect
      x="12.5"
      y="5"
      width="7"
      height="22"
      rx="3.5"
      fill="none"
      stroke="#ffffff"
      stroke-width="2.2"
      stroke-linejoin="round"
    />
    <!-- 상단 팁 채움 (Solid Tip) -->
    <path
      d="M 12.5 12.2 L 12.5 8.5 C 12.5 6.57 14.07 5 16 5 C 17.93 5 19.5 6.57 19.5 8.5 L 19.5 12.2 Z"
      fill="#ffffff"
    />
  </g>
</svg>
