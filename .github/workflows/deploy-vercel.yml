name: Deploy Monorepo to Vercel

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target (all or specific project: video, seedtick, gateway, chat, game)'
        required: true
        default: 'all'
  push:
    branches:
      - main
    paths:
      - 'reportist-video/**'
      - 'seedtick-ai-gateway/**'
      - 'reportist-chat/**'
      - 'reportist-game/**'
      - 'docs/**'
      - 'post/**'
      - 'reportist-admin/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. reportist-video 배포
  deploy-video:
    name: Deploy reportist-video
    runs-on: ubuntu-latest
    if: "!cancelled()"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if reportist-video changed
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.target }}" = "all" ] || [ "${{ github.event.inputs.target }}" = "video" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          elif git diff --name-only HEAD^ HEAD | grep -q "^reportist-video/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Vercel
        if: steps.filter.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_VIDEO }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN
          npx --yes vercel@latest build --prod --token=$VERCEL_TOKEN
          npx --yes vercel@latest deploy --prebuilt --prod --token=$VERCEL_TOKEN
        working-directory: ./reportist-video

  # 2. seedtick (메인 웹) 배포
  deploy-seedtick:
    name: Deploy seedtick
    runs-on: ubuntu-latest
    if: "!cancelled()"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if seedtick root changed
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.target }}" = "all" ] || [ "${{ github.event.inputs.target }}" = "seedtick" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          elif git diff --name-only HEAD^ HEAD | grep -E -v "^(reportist-|seedtick-ai-gateway/|\.github/)" | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Vercel
        if: steps.filter.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SEEDTICK }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN
          npx --yes vercel@latest build --prod --token=$VERCEL_TOKEN
          npx --yes vercel@latest deploy --prebuilt --prod --token=$VERCEL_TOKEN
        working-directory: ./

  # 3. seedtick-ai-gateway 배포
  deploy-gateway:
    name: Deploy seedtick-ai-gateway
    runs-on: ubuntu-latest
    if: "!cancelled()"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if seedtick-ai-gateway changed
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.target }}" = "all" ] || [ "${{ github.event.inputs.target }}" = "gateway" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          elif git diff --name-only HEAD^ HEAD | grep -q "^reportist-ai-gateway/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Vercel
        if: steps.filter.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_GATEWAY }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN
          npx --yes vercel@latest build --prod --token=$VERCEL_TOKEN
          npx --yes vercel@latest deploy --prebuilt --prod --token=$VERCEL_TOKEN
        working-directory: ./reportist-ai-gateway

  # 4. reportist-chat 배포
  deploy-chat:
    name: Deploy reportist-chat
    runs-on: ubuntu-latest
    if: "!cancelled()"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if reportist-chat changed
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.target }}" = "all" ] || [ "${{ github.event.inputs.target }}" = "chat" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          elif git diff --name-only HEAD^ HEAD | grep -q "^reportist-chat/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Vercel
        if: steps.filter.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CHAT }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN
          npx --yes vercel@latest build --prod --token=$VERCEL_TOKEN
          npx --yes vercel@latest deploy --prebuilt --prod --token=$VERCEL_TOKEN
        working-directory: ./reportist-chat

  # 5. reportist-game 배포
  deploy-game:
    name: Deploy reportist-game
    runs-on: ubuntu-latest
    if: "!cancelled()"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if reportist-game changed
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.target }}" = "all" ] || [ "${{ github.event.inputs.target }}" = "game" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          elif git diff --name-only HEAD^ HEAD | grep -q "^reportist-game/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Vercel
        if: steps.filter.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_GAME }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN
          npx --yes vercel@latest build --prod --token=$VERCEL_TOKEN
          npx --yes vercel@latest deploy --prebuilt --prod --token=$VERCEL_TOKEN
        working-directory: ./reportist-game
