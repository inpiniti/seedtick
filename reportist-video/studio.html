<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>PenguinCut Studio — AI Video Highlight Editor</title>
    <meta
      name="description"
      content="Open the PenguinCut studio: AI finds the strongest moments in your videos and turns them into one cinematic 16:9 highlight."
    />
    <meta name="author" content="PenguinCut" />
    <!-- The studio is a private, local-first workspace. Keep it out of search results. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://penguincut.com/studio" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=4" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48x48.png?v=4" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96x96.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png?v=4" />
    <link rel="apple-touch-icon" href="/icon-192x192.png?v=4" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f8f9fa" />
    <meta name="application-name" content="PenguinCut" />
    <meta name="apple-mobile-web-app-title" content="PenguinCut" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://penguincut.com/studio" />
    <meta property="og:site_name" content="PenguinCut" />
    <meta property="og:title" content="PenguinCut Studio — AI Video Highlight Editor" />
    <meta
      property="og:description"
      content="AI finds the strongest moments in your videos and turns them into one cinematic 16:9 highlight."
    />
    <meta property="og:image" content="https://penguincut.com/og-penguincut.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="PenguinCut — AI video highlight editor"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PenguinCut Studio — AI Video Highlight Editor" />
    <meta
      name="twitter:description"
      content="AI finds the strongest moments in your videos and turns them into one cinematic 16:9 highlight."
    />
    <meta name="twitter:image" content="https://penguincut.com/og-penguincut.png" />
    <meta name="twitter:image:alt" content="PenguinCut — AI video highlight editor" />

    <!-- Fonts: Pretendard CSS는 렌더링을 막지 않도록 비동기로 불러온다. (JetBrains Mono는 로컬 서브셋) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="preload"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      media="print"
      onload="this.media='all'"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f8f9fa;
        color: #0f172a;
      }

      .boot-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        background: #f8f9fa;
        font-family: "Pretendard Variable", Pretendard, -apple-system,
          BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR",
          sans-serif;
        text-align: center;
      }

      .boot-screen img {
        width: 72px;
        height: 72px;
        color: #0f172a;
      }

      .boot-brand {
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: #0f172a;
      }

      .boot-text {
        color: #64748b;
        font-size: 0.84rem;
      }

      .boot-bar {
        width: 132px;
        height: 2px;
        margin-top: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: #e2e8f0;
      }

      .boot-bar span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: #0f172a;
        animation: boot-slide 1.2s ease-in-out infinite;
      }

      @keyframes boot-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(340%);
        }
      }

      .noscript-message {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #f8f9fa;
        color: #0f172a;
        font-family: "Pretendard Variable", Pretendard, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-bar span {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; overflow: hidden">
    <div id="root">
      <div class="boot-screen" aria-live="polite">
        <img src="/penguin-logo.svg" alt="" width="72" height="72" />
        <div class="boot-brand">PenguinCut</div>
        <div class="boot-text">Loading the studio…</div>
        <div class="boot-bar" aria-hidden="true"><span></span></div>
      </div>
    </div>

    <noscript>
      <div class="noscript-message">
        <div>
          <div class="boot-brand">PenguinCut</div>
          <p style="max-width: 420px; margin: 12px auto 0; color: #64748b">
            The studio needs JavaScript. Please enable JavaScript in your browser
            and reload this page.
          </p>
        </div>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
